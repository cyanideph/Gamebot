name: Seed Pydroid data

on:
  push:
    branches: [uzzapbot-pydroid]

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bot branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original datasets from main
        run: |
          git fetch origin main
          mkdir -p UzzapBot/data
          for f in Zanime-trivia.txt Zgen-info.txt Zgta-foreign.txt Zgta-opm.txt Zlogic.txt salita.txt words.txt; do
            git show "origin/main:$f" > "UzzapBot/data/$f"
          done
          rm -f "words.txt"

      - name: Remove bootstrap workflow
        run: rm -f .github/workflows/seed-pydroid-data.yml

      - name: Commit restored datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Restore Gamebot datasets under UzzapBot data"
          git push origin HEAD:uzzapbot-pydroid
